services:
  ubom:
    build:
      context: .
      dockerfile: server/Dockerfile
      network: host
      args:
        UBOM_BUILD_ID: ${UBOM_BUILD_ID:-dev}
    command: ["-listen", "0.0.0.0:8080"]
    environment:
      UBOM_DATABASE_URL: postgresql://${POSTGRES_USER:-ubom}:${POSTGRES_PASSWORD:-ubom-dev-only}@postgres:5432/${POSTGRES_DB:-ubom}?sslmode=disable
      UBOM_BUILD_ID: ${UBOM_BUILD_ID:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      network: host
      args:
        VITE_APP_BUILD_ID: ${UBOM_BUILD_ID:-dev}
    depends_on:
      ubom:
        condition: service_healthy
    ports:
      - "${UBOM_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ubom}
      POSTGRES_USER: ${POSTGRES_USER:-ubom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ubom-dev-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
